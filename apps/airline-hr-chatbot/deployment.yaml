# Shared infrastructure (PostgreSQL, Adminer, Prometheus, Loki, Grafana, Promtail)
# lives in the `infra` namespace — see apps/infra/. This file holds only the
# stateless hr-chatbot app code (Chainlit app + Oracle mock MCP server), which
# connects to Postgres in infra via its FQDN.
# ─── Oracle Mock MCP Server ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle
  namespace: hr-chatbot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: oracle
          image: ghcr.io/trehansalil/airline-hr-chatbot:latest
          imagePullPolicy: Always
          command:
            - uvicorn
            - mock_oracle_server:app
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
# ─── Application (Chainlit HR Chatbot) ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: hr-chatbot
spec:
  # Chainlit uses in-process session state; keep at 1 until sticky sessions
  # or session externalization is implemented.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.infra.svc.cluster.local -p 5432 -U $POSTGRES_USER; do
                echo "waiting for postgres..."; sleep 2;
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
        - name: wait-oracle
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - until curl -sf http://oracle:8001/health; do echo "waiting for oracle..."; sleep 2; done
      containers:
        - name: app
          image: ghcr.io/trehansalil/airline-hr-chatbot:latest
          imagePullPolicy: Always
          command:
            - chainlit
            - run
            - app.py
            - --host
            - "0.0.0.0"
            - --port
            - "9040"
          ports:
            - name: chainlit
              containerPort: 9040
            - name: metrics
              containerPort: 9091
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: ORACLE_MCP_BASE_URL
              value: "http://oracle:8001"
            - name: LOG_LEVEL
              value: "INFO"
            - name: KNOWLEDGE_GAP_LOG
              value: "logs/knowledge_gaps.csv"
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: logs
          emptyDir: {}
