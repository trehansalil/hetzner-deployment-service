# Shared-infra Services (postgres, adminer, prometheus, loki, grafana) now live
# in the `infra` namespace. Only the app's own Services remain here.
# All services are ClusterIP — Traefik Ingress handles external access.
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
  namespace: hr-chatbot
spec:
  type: ClusterIP
  selector:
    app: oracle
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
# app: Chainlit UI (exposed via Ingress)
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: hr-chatbot
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
    - name: chainlit
      port: 9040
      targetPort: 9040
---
# app-metrics: Prometheus scrape endpoint (scraped cross-namespace by infra Prometheus)
apiVersion: v1
kind: Service
metadata:
  name: app-metrics
  namespace: hr-chatbot
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
