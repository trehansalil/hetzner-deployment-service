apiVersion: v1
kind: Service
metadata:
  name: pageindex-mcp
  namespace: pageindex-mcp
spec:
  type: ClusterIP
  selector:
    app: pageindex-mcp
  ports:
    - name: http
      port: 8201
      targetPort: 8201
---
# RFC-050 in-cluster Docling conversion service. The worker reaches it via
# DOCLING_SERVICE_URL=http://docling-service:8080 (pageindex-mcp-config).
apiVersion: v1
kind: Service
metadata:
  name: docling-service
  namespace: pageindex-mcp
spec:
  type: ClusterIP
  selector:
    app: docling-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
