apiVersion: v1
kind: ConfigMap
metadata:
  name: pageindex-mcp-config
  namespace: pageindex-mcp
data:
  # Object store + queue now live in the shared `infra` namespace.
  MINIO_ENDPOINT: "minio.infra.svc.cluster.local:9000"
  MINIO_BUCKET: "pageindex"
  MINIO_SECURE: "false"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8201"
  REDIS_URL: "redis://redis.infra.svc.cluster.local:6379/1"
  WEB_CONCURRENCY: "1"
  CACHE_TTL: "300"
  # LLM-01 routing lever (auto|openai|compatible|azure). Set explicitly so a
  # misconfiguration fails fast at startup (resolve_llm_provider). "azure" is the
  # active profile here. To target an OpenAI-compatible endpoint instead, set
  # "compatible", switch the models below to the bare names your endpoint serves,
  # and change the worker overrides from "azure/" to "openai/".
  LLM_PROVIDER: "azure"
  # Bare Azure deployment name. Used directly by AsyncAzureOpenAI in the server's
  # tool path (config.py:get_openai_client). The worker uses litellm via the
  # pageindex library and overrides these to "azure/<deployment>" in
  # worker-deployment.yaml — litellm needs the provider prefix to route to Azure.
  PAGEINDEX_MODEL: "gpt-4.1"
  PAGEINDEX_FILTER_MODEL: "gpt-4.1"
  PAGEINDEX_SEARCH_MODEL: "gpt-4.1"
  PAGEINDEX_SEARCH_CONCURRENCY: "3"
  # Azure OpenAI routing for litellm (worker side). API version is non-sensitive.
  # NOTE (LLM-01): configure_litellm() derives AZURE_API_BASE from OPENAI_BASE_URL
  # and AZURE_API_KEY from OPENAI_API_KEY at runtime, so OPENAI_BASE_URL (in the
  # Secret) is the single source of truth and MUST equal AZURE_API_BASE below.
  AZURE_API_BASE: "https://techlotus-openai-api.openai.azure.com"
  AZURE_API_VERSION: "2025-01-01-preview"
  # Native math-library thread caps. Without these, torch/onnxruntime/BLAS spawn
  # one thread per host vCPU (~4 on this node), which both saturates ~2 cores (the
  # observed "2x CPU" spike) and inflates per-thread scratch arenas that push the
  # worker past its memory limit. DOCLING_NUM_THREADS only bounds Docling's own
  # AcceleratorOptions pool; the OS-level caps below bound the native backends.
  DOCLING_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # --- Worker concurrency / memory-admission (see worker-scaledobject.yaml) ---
  # Node MemAvailable floor (bytes) required before a worker starts a conversion.
  # ~2.2Gi = one ~1.9Gi Docling job + margin on the 7.6Gi node.
  MEM_ADMISSION_FLOOR_BYTES: "2300000000"
  # Hard cap (s) a job waits for headroom before proceeding anyway (fail-open).
  MEM_ADMISSION_MAX_WAIT_S: "120"
  # Re-check cadence (s) while waiting for headroom.
  MEM_ADMISSION_POLL_S: "3"
  # How often the server publishes pageindex_arq_queue_depth (s).
  ARQ_QUEUE_DEPTH_SCRAPE_INTERVAL_S: "5"
  # --- Langfuse tracing (LLM-02) -------------------------------------------
  # Non-sensitive levers; the keys live in the Secret. Tracing activates only
  # when BOTH LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are set (Secret).
  # EU region (default); US = https://us.cloud.langfuse.com.
  LANGFUSE_HOST: "https://cloud.langfuse.com"
  # true = export full prompt/completion bodies (incl. document text) to
  # Langfuse Cloud; false = mask bodies, keep token usage + cost. NOTE (HR3):
  # this corpus is potential PII — true means document text leaves the cluster.
  LANGFUSE_TRACE_CONTENT: "true"
