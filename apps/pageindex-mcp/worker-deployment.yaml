apiVersion: apps/v1
kind: Deployment
metadata:
  name: pageindex-mcp-worker
  namespace: pageindex-mcp
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pageindex-mcp-worker
  template:
    metadata:
      labels:
        app: pageindex-mcp-worker
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/trehansalil/pageindex-mcp:latest
          imagePullPolicy: Always
          command: ["arq", "pageindex_mcp.worker.WorkerSettings"]
          # litellm (called by the pageindex library) routes to Azure only when
          # the model name carries the "azure/" prefix. The server side, which
          # uses AsyncAzureOpenAI directly, wants the bare deployment name and
          # inherits the unprefixed value from the ConfigMap. These overrides
          # exist solely to bridge that mismatch — drop them once config.py
          # auto-prefixes for Azure.
          env:
            - name: PAGEINDEX_MODEL
              value: "azure/gpt-4.1"
            - name: PAGEINDEX_FILTER_MODEL
              value: "azure/gpt-4.1"
            - name: PAGEINDEX_SEARCH_MODEL
              value: "azure/gpt-4.1"
          envFrom:
            - configMapRef:
                name: pageindex-mcp-config
            - secretRef:
                name: pageindex-mcp-secrets
          resources:
            requests:
              cpu: "200m"
              # Request stays low (Burstable QoS) on purpose: the worker bursts to
              # ~1.9Gi during Docling model-load/inference but idles far below that.
              # Keeping the request small makes the worker the FIRST pod evicted under
              # node memory pressure, protecting cotenants (neonatal-care, etcd) on
              # this shared 7.6Gi single node.
              memory: "512Mi"
            limits:
              cpu: "1000m"
              # Measured peak (2026-06-04, ACCURATE + threads=1) is ~1.92Gi total anon
              # on real German insurance PDFs; 1Gi was ~2x too small and OOMKilled.
              # 2Gi clears the anon floor (file cache is reclaimable under the limit).
              # Headroom is thin (~80Mi over AVB peak) — the durable fix is the Docling
              # pipeline downgrade, not a bigger limit (node can't spare 2.5Gi).
              memory: "2Gi"
