apiVersion: apps/v1
kind: Deployment
metadata:
  name: pageindex-mcp-worker
  namespace: pageindex-mcp
spec:
  # replicas is owned by the KEDA ScaledObject (worker-scaledobject.yaml): 1↔2.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pageindex-mcp-worker
  template:
    metadata:
      labels:
        app: pageindex-mcp-worker
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: worker
          image: ghcr.io/trehansalil/pageindex-mcp:latest
          imagePullPolicy: Always
          command: ["arq", "pageindex_mcp.worker.WorkerSettings"]
          # AZURE PROFILE (active; pairs with LLM_PROVIDER=azure in the ConfigMap).
          # litellm (called by the pageindex library) routes to Azure only when the
          # model name carries the "azure/" prefix. The server side uses
          # AsyncAzureOpenAI directly and wants the bare deployment name, which it
          # inherits from the ConfigMap. These overrides exist solely to bridge that
          # mismatch.
          #
          # COMPATIBLE PROFILE: set LLM_PROVIDER=compatible in the ConfigMap and swap
          # the three values below from "azure/<deployment>" to "openai/<model>"
          # (e.g. "openai/gpt-5.3-instant") served by your OPENAI_BASE_URL endpoint.
          env:
            - name: PAGEINDEX_MODEL
              value: "azure/gpt-4.1"
            - name: PAGEINDEX_FILTER_MODEL
              value: "azure/gpt-5.4-mini"
            - name: PAGEINDEX_SEARCH_MODEL
              value: "azure/gpt-5.4-nano"
          envFrom:
            - configMapRef:
                name: pageindex-mcp-config
            - secretRef:
                name: pageindex-mcp-secrets
          resources:
            requests:
              cpu: "200m"
              # RFC-050: Docling now runs in docling-service, so the worker no
              # longer bursts to ~1.9Gi. Sized for MAX_JOBS=2 on the service route
              # (was 512Mi request / 2500Mi limit for local Docling). Still
              # Burstable QoS. The 1.5Gi limit is an ASSUMPTION (service-path child
              # peak unmeasured) — if DOCLING_SERVICE_URL is ever emptied (local
              # Docling fallback) restore the 2500Mi limit or the child OOMs.
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
