# loki-tailscale-gateway: Loki push endpoint for the Mac, Tailscale only
# (RFC-052 D2, task 1.9). The Mac's Grafana Alloy pushes to
#   http://100.120.146.20:3100/loki/api/v1/push
#
# An nginx HTTP proxy on the host network of portfolio. It binds ONLY to
# portfolio's tailscale0 address, never 0.0.0.0, so the port does not exist
# on eth0 (public), enp7s0 (private network) or the pod network. No
# NodePort, no iptables guard, no operator step: deploy.yml applies this
# file on every push to main that touches apps/infra/**.
# Supersedes cluster/k3s/loki-tailscale/ (NodePort 31100 + apply-firewall.sh).
#
# Loki runs with auth_enabled: false, so this proxy is the API allow-list:
# only POST /loki/api/v1/push and GET /ready reach Loki. Everything else
# (query, labels, tail, /loki/api/v1/delete, /compactor/*, /config,
# /metrics, ...) gets 403 from nginx.
#
# The tailnet IP is set in ONE place: env TS_IP in the Deployment. Changing
# it changes the pod template, so the next apply rolls the pod. The
# entrypoint renders it (and the cluster DNS resolver, read from the pod's
# /etc/resolv.conf) into nginx.conf at start.
# If tailscale0 is not up yet (boot order), the entrypoint waits for the
# address instead of failing its bind; the pod stays NotReady meanwhile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-tailscale-gateway
  namespace: infra
  labels:
    app: loki-tailscale-gateway
data:
  # __TS_IP__ and __RESOLVER__ are filled in by entrypoint.sh.
  nginx.conf.tpl: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log stderr warn;

    events {
      worker_connections 256;
    }

    http {
      access_log /dev/stdout;
      server_tokens off;

      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;

      # Cluster DNS: re-resolve the Loki Service name instead of pinning
      # the IP nginx saw at start (proxy_pass with a variable forces that).
      resolver __RESOLVER__ valid=30s ipv6=off;
      resolver_timeout 5s;

      server {
        listen __TS_IP__:3100;

        # Alloy push batches (snappy protobuf) stay well under this.
        client_max_body_size 10m;
        client_body_buffer_size 1m;

        set $loki loki.infra.svc.cluster.local:3100;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # The forwarded path is a literal, never the client's raw URI, so
        # no encoding or dot-segment trick can reach another Loki route.
        location = /loki/api/v1/push {
          limit_except POST { deny all; }
          proxy_pass http://$loki/loki/api/v1/push;
        }

        # limit_except GET also passes HEAD; Loki itself answers HEAD with 405.
        location = /ready {
          limit_except GET { deny all; }
          proxy_pass http://$loki/ready;
        }

        location / {
          return 403;
        }
      }
    }
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    echo "$TS_IP" | grep -qE '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$' \
      || { echo "TS_IP=$TS_IP is not a dotted-quad IPv4 address" >&2; exit 1; }
    # The wait loop below silences ip's stderr; fail loudly here instead of
    # looping forever as "waiting" if the image lacks ip.
    command -v ip >/dev/null 2>&1 || { echo "ip not found in image" >&2; exit 1; }
    RESOLVER=$(awk '$1 == "nameserver" { print $2; exit }' /etc/resolv.conf)
    [ -n "$RESOLVER" ] || { echo "no nameserver in /etc/resolv.conf" >&2; exit 1; }
    until ip -4 -o addr show 2>/dev/null | grep -qF " inet $TS_IP/"; do
      echo "waiting for $TS_IP on a host interface (tailscale0 not up yet)"
      sleep 5
    done
    sed -e "s/__TS_IP__/$TS_IP/g" -e "s/__RESOLVER__/$RESOLVER/g" \
      /etc/gateway/nginx.conf.tpl > /tmp/nginx.conf
    echo "listening on $TS_IP:3100 (resolver $RESOLVER) -> loki.infra.svc.cluster.local:3100"
    exec nginx -c /tmp/nginx.conf -g 'daemon off;'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-tailscale-gateway
  namespace: infra
  labels:
    app: loki-tailscale-gateway
spec:
  replicas: 1
  # hostNetwork + a fixed host port: a surge pod could not bind while the
  # old one holds 100.120.146.20:3100. Stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki-tailscale-gateway
  template:
    metadata:
      labels:
        app: loki-tailscale-gateway
      annotations:
        # Bump when the ConfigMap above changes, so the apply rolls the pod.
        loki-tailscale-gateway/config-rev: "1"
    spec:
      hostNetwork: true
      # Resolve loki.infra.svc.cluster.local through CoreDNS despite hostNetwork.
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      # tailscale0 exists only on portfolio (the k3s server).
      nodeSelector:
        kubernetes.io/hostname: portfolio
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        # The nginx user of nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
          imagePullPolicy: IfNotPresent
          env:
            # portfolio's tailscale0 IPv4 (ip -4 addr show tailscale0).
            - name: TS_IP
              value: "100.120.146.20"
          command: ["/bin/sh", "/etc/gateway/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          # exec, not httpGet: httpGet.host would repeat the IP literal.
          # Proxies to Loki's /ready, so NotReady also means Loki is not ready.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "wget -q -T 3 -O /dev/null \"http://$TS_IP:3100/ready\""]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: loki-tailscale-gateway
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
