# One-time K8s Job to initialize the ClickHouse schema in the infra namespace.
# Run after the ClickHouse pod is healthy:
#   make init-clickhouse
#
# The schema SQL is NOT embedded here — it is mounted from the ConfigMap
# 'infra-sql-init', which must exist before this Job runs. Populate it from the
# neonatal-care source repo's schema:
#   kubectl create configmap infra-sql-init \
#     --from-file=init_clickhouse.sql=<path-to-file> -n infra
apiVersion: batch/v1
kind: Job
metadata:
  name: init-clickhouse
  namespace: infra
  labels:
    app: clickhouse
    job-type: db-init
spec:
  ttlSecondsAfterFinished: 300   # auto-cleanup after 5 min
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-clickhouse
        # Use the server image — it bundles the clickhouse-client binary. The standalone
        # clickhouse/clickhouse-client image was abandoned at 21.x (no 25.8 tag), so it
        # would ImagePullBackOff. This stays in lockstep with deployment.yaml and reuses
        # the image already pulled on the node.
        image: clickhouse/clickhouse-server:25.8
        command:
          - sh
          - -c
          - |
            clickhouse-client \
              --host clickhouse \
              --port 9000 \
              --user $(CLICKHOUSE_USER) \
              --password $(CLICKHOUSE_PASSWORD) \
              --database $(CLICKHOUSE_DB) \
              --multiquery < /sql/init_clickhouse.sql
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            configMapKeyRef:
              name: infra-config
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: infra-secrets
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_DB
          valueFrom:
            configMapKeyRef:
              name: infra-config
              key: CLICKHOUSE_DB
        volumeMounts:
        - name: sql-scripts
          mountPath: /sql
      volumes:
      - name: sql-scripts
        configMap:
          name: infra-sql-init
