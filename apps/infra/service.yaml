# All shared-infra services are ClusterIP — consumed cross-namespace via the
# FQDN <service>.infra.svc.cluster.local:<port>. Grafana and Adminer are also
# exposed externally through the Ingresses in ingress.yaml.
# Exception: `postgres` is a headless Service (clusterIP: None) — it is the
# governing Service for the postgres StatefulSet (see statefulset.yaml).
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: infra
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: infra
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infra
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: infra
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
# Headless governing Service for the postgres StatefulSet (serviceName: postgres):
# clusterIP: None gives the pod stable DNS (postgres-0.postgres.infra.svc.cluster.local),
# the standard StatefulSet pairing. With replicas: 1 the bare name
# postgres.infra.svc.cluster.local still resolves to the pod, so the hr-chatbot
# DATABASE_URL host is unchanged. NOTE: clusterIP is immutable — on a cluster where this
# Service already exists as a normal ClusterIP, delete it first
# (kubectl delete svc postgres -n infra) before re-applying.
spec:
  type: ClusterIP
  clusterIP: None
  # Keep publishing the pod's DNS A record even while it is NotReady (e.g. mid-restart),
  # so postgres.infra.svc.cluster.local does not NXDOMAIN during the unready window — a
  # headless Service otherwise only resolves ready endpoints. Cross-namespace clients then
  # get connection-refused and retry (DNS still resolves) instead of a hard DNS failure.
  publishNotReadyAddresses: true
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: adminer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
