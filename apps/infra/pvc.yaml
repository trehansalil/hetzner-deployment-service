# Persistent Volume Claims for all shared infrastructure.
# Every PVC pins storageClassName: local-path explicitly (k3s single-node HostPath,
# ReadWriteOnce) so a change to the cluster's *default* StorageClass can't silently
# move some volumes onto a different backend. For multi-node clusters switch every
# PVC's storageClassName to 'hcloud-volumes' (Hetzner CSI) for network-attached storage.
#
# local-path PVs are namespace-bound: data does NOT follow a PVC across namespaces.
# Migrating existing data from the old app-namespace PVCs into these is a one-time
# operation — see apps/infra/MIGRATION.md.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-logs
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
