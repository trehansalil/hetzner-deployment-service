apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: infra-claude-mem-ipallow@kubernetescrd,infra-claude-mem-strip-origin@kubernetescrd
  labels:
    app: claude-mem
  name: claude-mem
  namespace: infra
spec:
  ingressClassName: traefik
  rules:
  - host: mem.saliltrehan.com
    http:
      paths:
      - backend:
          service:
            name: synchub-service
            port:
              number: 3001
        path: /v1/sync
        pathType: Prefix
      - backend:
          service:
            name: claude-mem-server-beta
            port:
              number: 37877
        path: /v1
        pathType: Prefix
      - backend:
          service:
            name: claude-mem
            port:
              number: 37700
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - mem.saliltrehan.com
    secretName: claude-mem-tls

