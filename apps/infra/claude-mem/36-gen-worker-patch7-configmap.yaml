apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-mem-gen-worker-patch7
  namespace: infra
data:
  patch7.js: "#!/usr/bin/env node\n// Patch 7: Improve observation generation prompt to focus on substance over mechanics\nconst fs = require('fs');\nconst path = process.argv[2] || '/patched/scripts/server-service.cjs';\n\nlet code = fs.readFileSync(path, 'utf8');\n\nconst oldLines = [\n  '\"You are observing an agent at work. Return one or more\"',\n  '\"<observation>...</observation> XML blocks summarizing durable, useful\"',\n  '\"discoveries from the events above. If the events contain nothing worth\"',\n  '\"recording (e.g., everything was scrubbed by privacy filters or the\"',\n  '\"activity was trivial), return a single self-closing <skip_summary />\"',\n  '\"tag and nothing else. Do not include any prose outside the XML.\"',\n];\n\nconst newLines = [\n  '\"You are a senior developer\\\\\\'s memory system. Extract durable, substantive knowledge from the coding events above.\"',\n  '\"\"',\n  '\"WHAT TO CAPTURE: What was LEARNED (root causes, how systems work), DECIDED (architectural choices, trade-offs), FIXED (bugs and their causes), or BUILT (features, infrastructure). Describe findings as a developer would explain them to a colleague.\"',\n  '\"\"',\n  '\"WHAT TO OMIT: Never mention tool names (Read, Bash, Grep, ToolSearch, Edit, Write, etc.), MCP servers, function calls, API requests, file-reading mechanics, or agent internals. Do not describe HOW information was gathered \u2014 only WHAT was found and WHY it matters. Never say located, found via, searched for, or grep returned.\"',\n  '\"\"',\n  '\"Return one or more <observation>...</observation> XML blocks. If nothing worth recording, return <skip_summary /> and nothing else. No prose outside XML.\"',\n];\n\nconst target = oldLines.join(',');\nconst replacement = newLines.join(',');\n\nif (code.includes(target)) {\n  code = code.replace(target, replacement);\n  fs.writeFileSync(path, code);\n  console.log('Patch 7 applied: improved observation prompt for substance over mechanics');\n} else {\n  console.log('Patch 7 SKIPPED: target string not found in ' + path);\n}\n"
