apiVersion: batch/v1
kind: CronJob
metadata:
  name: claude-mem-summary-generator
  namespace: infra
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          initContainers:
          - name: install-deps
            image: node:22-slim
            command: ["sh", "-c", "npm install --prefix /work pg"]
            volumeMounts:
            - name: work
              mountPath: /work
          containers:
          - name: summary-generator
            image: node:22-slim
            command: ["sh", "-c", "NODE_PATH=/work/node_modules node /scripts/summary-generator.js"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: claude-mem-server-beta
            - name: PROJECT_ID
              value: "c88bc727-5fd6-47f8-9046-59617e40d8f5"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  key: GROQ_API_KEY
                  name: claude-mem-groq-key
            # llm-router (38-llm-router.yaml): Mac -> Groq -> 503. It overrides LLM_MODEL/LLM_API_KEY per backend.
            - name: LLM_URL
              value: "http://llm-router.infra.svc.cluster.local:8080/v1/chat/completions"
            - name: LLM_MODEL
              value: "openai/gpt-oss-20b"
            - name: BATCH_SIZE
              value: "10"
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 50m
                memory: 64Mi
            volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
          volumes:
          - name: script
            configMap:
              name: claude-mem-summary-generator-script
          - name: work
            emptyDir: {}
