apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-mem-sync-script
  namespace: infra
data:
  sync.py: "#!/usr/bin/env python3\nimport json\nimport os\nimport sqlite3\nimport subprocess\nimport sys\nfrom datetime import datetime, timezone\n\nSQLITE_PATH = os.environ.get(\"SQLITE_PATH\", \"/data/claude-mem.db\")\nPG_HOST = os.environ.get(\"PG_HOST\", \"postgres-0.postgres.infra.svc.cluster.local\")\nPG_PORT = os.environ.get(\"PG_PORT\", \"5432\")\nPG_USER = os.environ.get(\"PG_USER\", \"hrchatbot\")\nPG_PASS = os.environ.get(\"PG_PASS\", \"hrchatbot\")\nPG_DB = os.environ.get(\"PG_DB\", \"claude_mem\")\n\nos.environ[\"PGPASSWORD\"] = PG_PASS\n\ndef psql(query):\n    result = subprocess.run(\n        [\"psql\", \"-h\", PG_HOST, \"-p\", PG_PORT, \"-U\", PG_USER, \"-d\", PG_DB,\n         \"-t\", \"-A\", \"-c\", query],\n        capture_output=True, text=True, timeout=60\n    )\n    if result.returncode != 0:\n        print(f\"psql error: {result.stderr}\", file=sys.stderr)\n        sys.exit(1)\n    return result.stdout.strip()\n\ndef sync_sessions(db):\n    \"\"\"Sync server_sessions from PG to sdk_sessions in SQLite with full metadata.\"\"\"\n    cur = db.cursor()\n\n    cur.execute(\"SELECT COALESCE(MAX(started_at_epoch), 0) FROM sdk_sessions WHERE platform_source = 'pg-sync'\")\n    max_epoch = cur.fetchone()[0]\n\n    # Sessions first synced while still running need a later pass to pick up\n    # ended_at/status, but their started_at is below the MAX() watermark. Drop the\n    # scan floor to the oldest still-active row so the UPDATE branch can reach them.\n    cur.execute(\"SELECT COALESCE(MIN(started_at_epoch), 0) FROM sdk_sessions \"\n                \"WHERE platform_source = 'pg-sync' AND status = 'active'\")\n    active_epoch = cur.fetchone()[0]\n\n    candidates = [e for e in (max_epoch, active_epoch) if e > 0]\n    scan_epoch = min(candidates) if candidates else 0\n    if scan_epoch > 0:\n        cutoff = datetime.fromtimestamp(scan_epoch / 1000, tz=timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%S.000Z\")\n    else:\n        cutoff = \"2020-01-01T00:00:00Z\"\n    print(f\"Sessions cutoff: {cutoff} (epoch {scan_epoch})\")\n\n    raw = psql(f\"\"\"\n        SELECT json_build_object(\n            'id', id,\n            'project_id', project_id,\n            'content_session_id', content_session_id,\n            'platform_source', platform_source,\n            'metadata', metadata,\n            'started_at', to_char(started_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"'),\n            'ended_at', to_char(ended_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"'),\n            'start_epoch', EXTRACT(EPOCH FROM started_at) * 1000,\n            'end_epoch', EXTRACT(EPOCH FROM ended_at) * 1000\n        )\n        FROM server_sessions\n        WHERE started_at >= '{cutoff}'\n        ORDER BY started_at ASC;\n    \"\"\")\n\n    if not raw:\n        print(\"No sessions to sync\")\n        return\n\n    lines = [l for l in raw.split(\"\\n\") if l.strip()]\n    updated = 0\n    inserted = 0\n\n    for line in lines:\n        try:\n            row = json.loads(line)\n        except json.JSONDecodeError:\n            continue\n\n        session_id = row[\"id\"]\n        meta = row.get(\"metadata\") or {}\n        project = meta.get(\"project\") or row.get(\"project_id\", \"unknown\")\n        user_prompt = meta.get(\"prompt\")\n        started_at = row[\"started_at\"]\n        ended_at = row.get(\"ended_at\")\n        start_epoch = int(float(row[\"start_epoch\"])) if row.get(\"start_epoch\") else 0\n        end_epoch = int(float(row[\"end_epoch\"])) if row.get(\"end_epoch\") else None\n        content_session_id = row.get(\"content_session_id\") or session_id\n\n        cur.execute(\"SELECT id, project FROM sdk_sessions WHERE memory_session_id = ?\", (session_id,))\n        existing = cur.fetchone()\n\n        if existing:\n            cur.execute(\"\"\"UPDATE sdk_sessions SET\n                project = ?, user_prompt = ?, completed_at = ?,\n                completed_at_epoch = ?, status = ?\n                WHERE memory_session_id = ?\"\"\",\n                (project, user_prompt, ended_at, end_epoch,\n                 'completed' if ended_at else 'active', session_id))\n            updated += 1\n        else:\n            cur.execute(\"\"\"INSERT OR IGNORE INTO sdk_sessions\n                (content_session_id, memory_session_id, project, platform_source,\n                 user_prompt, started_at, started_at_epoch, completed_at,\n                 completed_at_epoch, status)\n                VALUES (?, ?, ?, 'pg-sync', ?, ?, ?, ?, ?, ?)\"\"\",\n                (content_session_id, session_id, project, user_prompt,\n                 started_at, start_epoch, ended_at, end_epoch,\n                 'completed' if ended_at else 'active'))\n            inserted += 1\n\n    db.commit()\n    print(f\"Sessions: {inserted} inserted, {updated} updated\")\n\ndef sync_observations(db):\n    \"\"\"Sync observations from PG to SQLite.\"\"\"\n    cur = db.cursor()\n\n    cur.execute(\"SELECT COALESCE(MAX(created_at_epoch), 0) FROM observations\")\n    max_epoch = cur.fetchone()[0]\n    if max_epoch > 0:\n        cutoff = datetime.fromtimestamp(max_epoch / 1000, tz=timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%S.000Z\")\n    else:\n        cutoff = \"2020-01-01T00:00:00Z\"\n    print(f\"Observations cutoff: {cutoff} (epoch {max_epoch})\")\n\n    cur.execute(\"SELECT content_hash FROM observations WHERE content_hash IS NOT NULL\")\n    existing = set(r[0] for r in cur.fetchall())\n    print(f\"Existing observation hashes: {len(existing)}\")\n\n    raw = psql(f\"\"\"\n        SELECT json_build_object(\n            'id', o.id,\n            'project_id', o.project_id,\n            'session_id', o.server_session_id,\n            'kind', o.kind,\n            'content', o.content,\n            'meta', o.metadata,\n            'created_at', to_char(o.created_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"'),\n            'epoch', EXTRACT(EPOCH FROM o.created_at) * 1000,\n            'session_meta', s.metadata\n        )\n        FROM observations o\n        LEFT JOIN server_sessions s ON o.server_session_id = s.id\n        WHERE o.created_at > '{cutoff}'\n        ORDER BY o.created_at ASC;\n    \"\"\")\n\n    if not raw:\n        print(\"No new observations to sync\")\n        return\n\n    lines = [l for l in raw.split(\"\\n\") if l.strip()]\n    print(f\"PG observations to process: {len(lines)}\")\n\n    inserted = 0\n    skipped = 0\n\n    for line in lines:\n        try:\n            row = json.loads(line)\n        except json.JSONDecodeError:\n            continue\n\n        pg_id = row[\"id\"]\n        dedup_hash = f\"pg_{pg_id.replace('-', '')[:12]}\"\n\n        if dedup_hash in existing:\n            skipped += 1\n            continue\n\n        meta = row.get(\"meta\") or {}\n        session_meta = row.get(\"session_meta\") or {}\n        session_id = row.get(\"session_id\") or \"unknown-session\"\n        epoch_ms = int(float(row[\"epoch\"]))\n        project = (session_meta.get(\"project\")\n                   or meta.get(\"project_name\")\n                   or meta.get(\"project\")\n                   or row.get(\"project_id\", \"unknown\"))\n\n        cur.execute(\"SELECT 1 FROM sdk_sessions WHERE memory_session_id = ?\", (session_id,))\n        if not cur.fetchone():\n            cur.execute(\n                \"\"\"INSERT OR IGNORE INTO sdk_sessions\n                (content_session_id, memory_session_id, project, platform_source,\n                 user_prompt, started_at, started_at_epoch, status)\n                VALUES (?, ?, ?, 'pg-sync', ?, ?, ?, 'completed')\"\"\",\n                (session_id, session_id, project,\n                 session_meta.get(\"prompt\"), row[\"created_at\"], epoch_ms)\n            )\n\n        facts = json.dumps(meta[\"facts\"]) if meta.get(\"facts\") else None\n        concepts = json.dumps(meta[\"concepts\"]) if meta.get(\"concepts\") else None\n        files_read = json.dumps(meta[\"files_read\"]) if meta.get(\"files_read\") else None\n        files_modified = json.dumps(meta[\"files_modified\"]) if meta.get(\"files_modified\") else None\n        sqlite_meta = json.dumps({\"pg_id\": pg_id, \"pg_provider\": meta.get(\"provider\")})\n\n        cur.execute(\n            \"\"\"INSERT INTO observations\n            (memory_session_id, project, text, type, title, subtitle, facts,\n             narrative, concepts, files_read, files_modified, prompt_number,\n             discovery_tokens, created_at, created_at_epoch, content_hash,\n             generated_by_model, metadata, synced_at)\n            VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, NULL, 0, ?, ?, ?, ?, ?, ?)\"\"\",\n            (session_id, project, row[\"content\"],\n             row.get(\"kind\", \"observation\"),\n             meta.get(\"title\"), meta.get(\"subtitle\"), facts,\n             meta.get(\"narrative\"), concepts, files_read, files_modified,\n             row[\"created_at\"], epoch_ms, dedup_hash,\n             meta.get(\"model\"), sqlite_meta, epoch_ms)\n        )\n\n        existing.add(dedup_hash)\n        inserted += 1\n\n    db.commit()\n    print(f\"Observations: {inserted} inserted, {skipped} skipped\")\n\ndef fix_project_names(db):\n    \"\"\"Fix observations and sessions that used the PG UUID as project name.\"\"\"\n    cur = db.cursor()\n    pg_uuid = \"c88bc727-5fd6-47f8-9046-59617e40d8f5\"\n\n    cur.execute(\"\"\"SELECT DISTINCT o.memory_session_id\n        FROM observations o WHERE o.project = ?\"\"\", (pg_uuid,))\n    sessions_to_fix = [r[0] for r in cur.fetchall()]\n\n    if not sessions_to_fix:\n        print(\"No UUID project names to fix\")\n        return\n\n    raw = psql(f\"\"\"\n        SELECT id, metadata->>'project' as project_name\n        FROM server_sessions\n        WHERE metadata->>'project' IS NOT NULL;\n    \"\"\")\n\n    session_project_map = {}\n    if raw:\n        for line in raw.split(\"\\n\"):\n            if \"|\" in line:\n                sid, proj = line.split(\"|\", 1)\n                session_project_map[sid.strip()]\
    \ = proj.strip()\n\n    fixed_obs = 0\n    fixed_sessions = 0\n    for session_id in sessions_to_fix:\n        project_name = session_project_map.get(session_id, \"Desktop\")\n        cur.execute(\"UPDATE observations SET project = ? WHERE memory_session_id = ? AND project = ?\",\n                    (project_name, session_id, pg_uuid))\n        fixed_obs += cur.rowcount\n        cur.execute(\"UPDATE sdk_sessions SET project = ? WHERE memory_session_id = ? AND project = ?\",\n                    (project_name, session_id, pg_uuid))\n        fixed_sessions += cur.rowcount\n\n    db.commit()\n    print(f\"Fixed project names: {fixed_obs} observations, {fixed_sessions} sessions\")\n\ndef synthesize_summaries(db):\n    \"\"\"Create session_summaries for PG-synced sessions that don't have any.\"\"\"\n    cur = db.cursor()\n\n    cur.execute(\"\"\"\n        SELECT s.memory_session_id, s.project, s.user_prompt,\n               s.started_at, s.started_at_epoch\n        FROM sdk_sessions s\n        WHERE NOT EXISTS (\n            SELECT 1 FROM session_summaries ss\n            WHERE ss.memory_session_id = s.memory_session_id\n        )\n        AND EXISTS (\n            SELECT 1 FROM observations o\n            WHERE o.memory_session_id = s.memory_session_id\n        )\n        ORDER BY s.started_at_epoch DESC\n    \"\"\")\n    sessions = cur.fetchall()\n\n    if not sessions:\n        print(\"No sessions need summary synthesis\")\n        return\n\n    created = 0\n    for session_id, project, user_prompt, started_at, started_epoch in sessions:\n        cur.execute(\"\"\"\n            SELECT title, subtitle, narrative, type, facts\n            FROM observations\n            WHERE memory_session_id = ?\n            ORDER BY created_at_epoch ASC\n        \"\"\", (session_id,))\n        obs_rows = cur.fetchall()\n\n        if not obs_rows:\n            continue\n\n        titles = [r[0] for r in obs_rows if r[0]]\n        subtitles = [r[1] for r in obs_rows if r[1]]\n        narratives = [r[2] for r in obs_rows if r[2]]\n        types = [r[3] for r in obs_rows if r[3]]\n\n        all_facts = []\n        for r in obs_rows:\n            if r[4]:\n                try:\n                    parsed = json.loads(r[4])\n                    if isinstance(parsed, list):\n                        all_facts.extend(parsed[:5])\n                except (json.JSONDecodeError, TypeError):\n                    pass\n\n        request = user_prompt or (titles[0] if titles else \"Session via server API\")\n        investigated = \"; \".join(titles[:5]) if titles else None\n        learned = \"; \".join(all_facts[:5]) if all_facts else (\"; \".join(subtitles[:3]) if subtitles else None)\n        completed = \"; \".join(titles[-3:]) if len(titles) > 1 else (titles[0] if titles else None)\n\n        cur.execute(\"\"\"INSERT INTO session_summaries\n            (memory_session_id, project, request, investigated, learned,\n             completed, next_steps, prompt_number, discovery_tokens,\n             created_at, created_at_epoch, synced_at)\n            VALUES (?, ?, ?, ?, ?, ?, NULL, 1, 0, ?, ?, ?)\"\"\",\n            (session_id, project, request, investigated, learned,\n             completed, started_at, started_epoch, started_epoch))\n        created += 1\n\n    db.commit()\n    print(f\"Session summaries: {created} synthesized\")\n\ndef sync_prompts(db):\n    \"\"\"Sync prompts from PG user_prompts table into SQLite user_prompts.\"\"\"\n    cur = db.cursor()\n\n    cur.execute(\"SELECT COALESCE(MAX(created_at_epoch), 0) FROM user_prompts WHERE synced_at IS NOT NULL\")\n    max_epoch = cur.fetchone()[0]\n    if max_epoch > 0:\n        cutoff = datetime.fromtimestamp(max_epoch / 1000, tz=timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%S.000Z\")\n    else:\n        cutoff = \"2020-01-01T00:00:00Z\"\n\n    cur.execute(\"SELECT content_session_id, prompt_number FROM user_prompts WHERE synced_at IS NOT NULL\")\n    existing = set((r[0], r[1]) for r in cur.fetchall())\n\n    raw = psql(f\"\"\"\n        SELECT json_build_object(\n            'session_id', p.server_session_id,\n            'content_session_id', p.content_session_id,\n            'project', p.project,\n            'prompt_number', p.prompt_number,\n            'prompt_text', p.prompt_text,\n            'created_at', to_char(p.created_at, 'YYYY-MM-DD\"T\"HH24:MI:SS.MS\"Z\"'),\n            'epoch', p.created_at_epoch\n        )\n        FROM user_prompts p\n        WHERE p.created_at > '{cutoff}'\n        ORDER BY p.created_at ASC;\n    \"\"\")\n\n    if not raw:\n        print(\"No prompts to sync\")\n        return\n\n    lines = [l for l in raw.split(\"\\n\") if l.strip()]\n    inserted = 0\n    skipped = 0\n\n    for line in lines:\n        try:\n            row = json.loads(line)\n        except json.JSONDecodeError:\n            continue\n\n        content_session_id = row[\"content_session_id\"]\n        prompt_number = row[\"prompt_number\"]\n\n        if (content_session_id, prompt_number) in existing:\n            skipped += 1\n            continue\n\n        session_id = row[\"session_id\"]\n        epoch_ms = int(float(row[\"epoch\"]))\n\n        cur.execute(\"SELECT id FROM sdk_sessions WHERE memory_session_id = ?\", (session_id,))\n        session_row = cur.fetchone()\n        session_db_id = session_row[0] if session_row else None\n\n        cur.execute(\n            \"\"\"INSERT OR IGNORE INTO user_prompts\n            (session_db_id, content_session_id, prompt_number, prompt_text,\n             created_at, created_at_epoch, synced_at)\n            VALUES (?, ?, ?, ?, ?, ?, ?)\"\"\",\n            (session_db_id, content_session_id, prompt_number, row[\"prompt_text\"],\n             row[\"created_at\"], epoch_ms, epoch_ms)\n        )\n        if cur.rowcount > 0:\n            existing.add((content_session_id, prompt_number))\n            inserted += 1\n        else:\n            skipped += 1\n\n    db.commit()\n    print(f\"Prompts: {inserted} inserted, {skipped} skipped\")\n\ndef main():\n    now = datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    print(f\"{now} Starting PG\u2192SQLite sync (v3)\")\n\n    db = sqlite3.connect(SQLITE_PATH)\n\n    sync_sessions(db)\n    sync_observations(db)\n    sync_prompts(db)\n    fix_project_names(db)\n    synthesize_summaries(db)\n\n    db.close()\n    now = datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\")\n    print(f\"{now} Sync complete\")\n\nif __name__ == \"__main__\":\n    main()\n"
