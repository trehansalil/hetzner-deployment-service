# ─── n8n ──────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: infra
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate    # PVC-backed (SQLite) with file locks — cannot run two pods simultaneously
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: WEBHOOK_URL
          valueFrom:
            configMapKeyRef:
              name: infra-config
              key: WEBHOOK_URL
        # N8N_HOST is the PUBLIC hostname used to build URLs/webhooks — NOT a
        # bind address. Binding to all interfaces is handled by the default
        # N8N_LISTEN_ADDRESS (::), so the pod stays reachable on 5678.
        - name: N8N_HOST
          value: "infra.saliltrehan.com"
        - name: N8N_PORT
          value: "5678"
        # Internal protocol on the pod's own socket. Traefik terminates TLS and
        # forwards plain HTTP, so this stays http; the public https scheme is
        # conveyed via N8N_EDITOR_BASE_URL/WEBHOOK_URL + X-Forwarded-Proto.
        - name: N8N_PROTOCOL
          value: "http"
        # Prefix passed through unstripped by Traefik (no StripPrefix on the
        # /automation route); n8n serves the editor/REST/push under this base.
        - name: N8N_PATH
          value: "/automation/"
        # Public editor base, including the subpath + trailing slash, so the
        # editor builds absolute links / OAuth callbacks against the public host.
        - name: N8N_EDITOR_BASE_URL
          value: "https://infra.saliltrehan.com/automation/"
        # Browser reaches n8n over HTTPS (TLS terminated at Traefik), so the
        # auth cookie can and should be Secure.
        - name: N8N_SECURE_COOKIE
          value: "true"
        # Exactly one reverse proxy in front (Traefik) — enables Express
        # `trust proxy` so n8n trusts X-Forwarded-For/Host/Proto. Without it
        # recent n8n logs a trust-proxy error and can mis-detect scheme/IP.
        - name: N8N_PROXY_HOPS
          value: "1"
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data
---
# ─── Adminer (PostgreSQL web UI) ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: infra
  labels:
    app: adminer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          # postgres is co-located in the infra namespace — short name resolves.
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: adminer
          image: adminer:4.8.1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# ─── Prometheus ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: infra
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate    # TSDB uses file lock on /prometheus — cannot run two pods simultaneously
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsUser: 65534   # nobody
        runAsNonRoot: true
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
# ─── Loki ─────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: infra
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate    # Compactor uses file lock on /loki — cannot run two pods simultaneously
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
# ─── Grafana ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate    # SQLite DB on PVC uses file lock — cannot run two pods simultaneously
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        fsGroup: 472
      initContainers:
        # prometheus and loki are co-located in infra — short names resolve.
        - name: wait-prometheus
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - until curl -sf http://prometheus:9090/-/ready; do echo "waiting for prometheus..."; sleep 3; done
        - name: wait-loki
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - until curl -sf http://loki:3100/ready; do echo "waiting for loki..."; sleep 3; done
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: monitoring-secrets
          env:
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            # Served under https://infra.saliltrehan.com/grafana. The trailing
            # slash is load-bearing (drives asset URLs, login POST, OAuth
            # callbacks). serve_from_sub_path=true makes Grafana emit subpath-
            # prefixed asset URLs and serve the UI/API under /grafana with the
            # prefix PASSED THROUGH (no Traefik StripPrefix). The broken combo
            # is strip + serve_from_sub_path, which infinite-301-loops (#72577).
            - name: GF_SERVER_ROOT_URL
              value: "https://infra.saliltrehan.com/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SERVER_DOMAIN
              value: "infra.saliltrehan.com"
            # Pod speaks plain HTTP on :3000; TLS is terminated upstream at
            # Traefik. /metrics and /api/health stay at the container root
            # (not under /grafana), so the in-cluster Prometheus scrape of
            # grafana:3000 keeps working.
            - name: GF_SERVER_PROTOCOL
              value: "http"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-json
