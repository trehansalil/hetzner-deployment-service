# Stateful infrastructure (ClickHouse, MinIO, Redis, n8n) lives in the shared
# `infra` namespace — see apps/infra/. This file holds only the stateless
# neonatal-care app code, which connects to infra via FQDN service names.
# ─── Flask Backend ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neonatal-care-backend
  namespace: neonatal-care
  labels:
    app: neonatal-care-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # terminate old pod BEFORE starting new one — prevents double-memory pressure
      maxUnavailable: 1
  selector:
    matchLabels:
      app: neonatal-care-backend
  template:
    metadata:
      labels:
        app: neonatal-care-backend
    spec:
      terminationGracePeriodSeconds: 60  # allow gunicorn to drain in-flight requests
      containers:
      - name: neonatal-care-backend
        # Updated by CI/CD: ghcr.io/trehansalil/neonatal-care:<sha>
        image: ghcr.io/trehansalil/neonatal-care:latest
        command:
          - uv
          - run
          - gunicorn
          - --workers=2
          - --worker-class=gevent
          - --worker-connections=1000
          - --bind=0.0.0.0:5000
          - --timeout=300
          - app:app
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: neonatal-care-config
        - secretRef:
            name: neonatal-care-secrets
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"   # raised from 256Mi — matches steady-state usage (actual: ~520Mi)
            cpu: "200m"
          limits:
            memory: "1536Mi"  # raised from 1Gi — headroom for gunicorn worker startup spike
            cpu: "1000m"
---
# ─── Nginx (static files + reverse proxy) ─────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neonatal-care-nginx
  namespace: neonatal-care
  labels:
    app: neonatal-care-nginx
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # initContainer pulls full backend image — avoid concurrent image pulls under pressure
      maxUnavailable: 1
  selector:
    matchLabels:
      app: neonatal-care-nginx
  template:
    metadata:
      labels:
        app: neonatal-care-nginx
    spec:
      initContainers:
      # Copy static HTML files from the backend image into a shared volume
      - name: copy-static
        image: ghcr.io/trehansalil/neonatal-care:latest
        command: ["sh", "-c", "cp -r /app/html/. /static/"]
        volumeMounts:
        - name: static-files
          mountPath: /static
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: static-files
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: neonatal-care-nginx-config
      - name: static-files
        emptyDir: {}
