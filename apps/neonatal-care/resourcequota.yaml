apiVersion: v1
kind: ResourceQuota
metadata:
  name: neonatal-care-quota
  namespace: neonatal-care
spec:
  hard:
    # Sized for the stateless app only (backend + nginx + cleanup CronJob).
    # The stateful datastores moved to the `infra` namespace, so this quota was
    # relaxed from the original full-stack sizing.
    requests.memory: "1Gi"
    limits.memory: "3Gi"
    requests.cpu: "750m"
    limits.cpu: "3000m"
    # Pod count: hard stop against accumulation of evicted pod objects
    pods: "15"
    persistentvolumeclaims: "2"
    services: "10"
    count/jobs.batch: "5"
    count/cronjobs.batch: "5"
