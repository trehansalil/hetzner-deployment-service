# Stateful infra Services (ClickHouse, MinIO, Redis, n8n) now live in the
# `infra` namespace. Only the app's own Services remain here.
apiVersion: v1
kind: Service
metadata:
  name: neonatal-care-backend
  namespace: neonatal-care
spec:
  selector:
    app: neonatal-care-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
# Nginx is the only service exposed externally (via Ingress)
apiVersion: v1
kind: Service
metadata:
  name: neonatal-care-nginx
  namespace: neonatal-care
spec:
  selector:
    app: neonatal-care-nginx
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
