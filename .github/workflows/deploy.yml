# Deploy workflow — lives in hetzner-deployment-service
# Triggered by:
#   1. A repository_dispatch event from neonatal-care-repo or airline-hr-chatbot after image push
#   2. Manual workflow_dispatch for any app

name: Deploy to Hetzner

on:
  repository_dispatch:
    types:
      - neonatal-care-image-updated
      - airline-hr-chatbot-image-updated
      - pageindex-mcp-image-updated
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        default: 'neonatal-care'
        type: choice
        options:
          - infra
          - neonatal-care
          - airline-hr-chatbot
          - pageindex-mcp
      image_tag:
        description: 'Image tag (SHA or latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Determine app and image tag
        id: vars
        run: |
          APP=${{ github.event.client_payload.app || github.event.inputs.app || 'neonatal-care' }}
          TAG=${{ github.event.client_payload.image_tag || github.event.inputs.image_tag || 'latest' }}
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      # Shared infrastructure — manual deploys only (3rd-party images, no rollout).
      # Secrets are gitignored and must be created out-of-band (make k8s-secrets-infra).
      - name: Apply k8s manifests — infra
        if: steps.vars.outputs.app == 'infra' && github.event_name == 'workflow_dispatch'
        run: |
          kubectl apply -f apps/infra/namespace.yaml
          kubectl apply -f apps/infra/configmap.yaml -n infra
          kubectl apply -f apps/infra/pvc.yaml -n infra
          kubectl apply -f apps/infra/rbac.yaml
          kubectl apply -f apps/infra/statefulset.yaml -n infra
          kubectl apply -f apps/infra/deployment.yaml -n infra
          kubectl apply -f apps/infra/daemonset.yaml -n infra
          kubectl apply -f apps/infra/service.yaml -n infra
          kubectl apply -f apps/infra/certificate.yaml -n infra
          kubectl apply -f apps/infra/ingress.yaml -n infra
          # The legacy per-host Ingresses superseded by this consolidated host live in
          # the hr-chatbot namespace (hr-chatbot-grafana / hr-chatbot-adminer) and must
          # keep serving through the migration validation window — they are pruned at
          # decommission, not here. See apps/infra/MIGRATION.md Phase 5.
          kubectl apply -f apps/infra/cronjob-pod-cleanup.yaml -n infra

      - name: Apply k8s manifests — neonatal-care
        if: steps.vars.outputs.app == 'neonatal-care'
        run: |
          kubectl apply -f apps/neonatal-care/namespace.yaml
          kubectl apply -f apps/neonatal-care/limitrange.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/resourcequota.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/configmap.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/deployment.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/service.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/ingress.yaml -n neonatal-care
          kubectl apply -f apps/neonatal-care/cronjob-pod-cleanup.yaml -n neonatal-care

      - name: Apply k8s manifests — airline-hr-chatbot
        if: steps.vars.outputs.app == 'airline-hr-chatbot'
        run: |
          kubectl apply -f apps/airline-hr-chatbot/namespace.yaml
          kubectl apply -f apps/airline-hr-chatbot/deployment.yaml -n hr-chatbot
          kubectl apply -f apps/airline-hr-chatbot/service.yaml -n hr-chatbot
          kubectl apply -f apps/airline-hr-chatbot/ingress.yaml -n hr-chatbot
          kubectl apply -f apps/airline-hr-chatbot/cronjob-pod-cleanup.yaml -n hr-chatbot

      - name: Post-deploy pod cleanup — airline-hr-chatbot
        if: steps.vars.outputs.app == 'airline-hr-chatbot'
        run: |
          kubectl delete pods -n hr-chatbot --field-selector=status.phase==Failed --ignore-not-found || true
          kubectl delete pods -n hr-chatbot --field-selector=status.phase==Succeeded --ignore-not-found || true

      - name: Apply k8s manifests — pageindex-mcp
        if: steps.vars.outputs.app == 'pageindex-mcp'
        run: |
          kubectl apply -f apps/pageindex-mcp/namespace.yaml
          kubectl apply -f apps/pageindex-mcp/configmap.yaml -n pageindex-mcp
          kubectl apply -f apps/pageindex-mcp/deployment.yaml -n pageindex-mcp
          kubectl apply -f apps/pageindex-mcp/worker-deployment.yaml -n pageindex-mcp
          kubectl apply -f apps/pageindex-mcp/service.yaml -n pageindex-mcp
          kubectl apply -f apps/pageindex-mcp/certificate.yaml -n pageindex-mcp
          kubectl apply -f apps/pageindex-mcp/ingress.yaml -n pageindex-mcp
          kubectl delete ingress pageindex-mcp -n pageindex-mcp --ignore-not-found
          kubectl apply -f apps/pageindex-mcp/cronjob-pod-cleanup.yaml -n pageindex-mcp

      - name: Update image tag (rolling deploy) — neonatal-care
        if: steps.vars.outputs.app == 'neonatal-care'
        run: |
          kubectl set image deployment/neonatal-care-backend \
            neonatal-care-backend=ghcr.io/trehansalil/neonatal-care:${{ steps.vars.outputs.image_tag }} \
            -n neonatal-care
          kubectl set image deployment/neonatal-care-nginx \
            copy-static=ghcr.io/trehansalil/neonatal-care:${{ steps.vars.outputs.image_tag }} \
            -n neonatal-care
          kubectl rollout restart deployment/neonatal-care-nginx -n neonatal-care
          kubectl rollout status deployment/neonatal-care-backend -n neonatal-care --timeout=300s
          kubectl rollout status deployment/neonatal-care-nginx -n neonatal-care --timeout=120s

      - name: Update image tag (rolling deploy) — airline-hr-chatbot
        if: steps.vars.outputs.app == 'airline-hr-chatbot'
        run: |
          kubectl set image deployment/app \
            app=ghcr.io/trehansalil/airline-hr-chatbot:${{ steps.vars.outputs.image_tag }} \
            -n hr-chatbot
          kubectl set image deployment/oracle \
            oracle=ghcr.io/trehansalil/airline-hr-chatbot:${{ steps.vars.outputs.image_tag }} \
            -n hr-chatbot
          kubectl rollout status deployment/app -n hr-chatbot --timeout=300s
          kubectl rollout status deployment/oracle -n hr-chatbot --timeout=120s

      - name: Update image tag (rolling deploy) — pageindex-mcp
        if: steps.vars.outputs.app == 'pageindex-mcp'
        run: |
          kubectl set image deployment/pageindex-mcp \
            pageindex-mcp=ghcr.io/trehansalil/pageindex-mcp:${{ steps.vars.outputs.image_tag }} \
            -n pageindex-mcp
          kubectl set image deployment/pageindex-mcp-worker \
            worker=ghcr.io/trehansalil/pageindex-mcp:${{ steps.vars.outputs.image_tag }} \
            -n pageindex-mcp
          kubectl rollout status deployment/pageindex-mcp -n pageindex-mcp --timeout=300s
          kubectl rollout status deployment/pageindex-mcp-worker -n pageindex-mcp --timeout=300s

      - name: Post-deploy pod cleanup — neonatal-care
        if: steps.vars.outputs.app == 'neonatal-care'
        run: |
          echo "Cleaning up evicted/failed/succeeded pods post-deploy..."
          kubectl delete pods -n neonatal-care --field-selector=status.phase==Failed --ignore-not-found || true
          kubectl delete pods -n neonatal-care --field-selector=status.phase==Succeeded --ignore-not-found || true

      - name: Post-deploy pod cleanup — pageindex-mcp
        if: steps.vars.outputs.app == 'pageindex-mcp'
        run: |
          echo "Cleaning up evicted/failed/succeeded pods post-deploy..."
          kubectl delete pods -n pageindex-mcp --field-selector=status.phase==Failed --ignore-not-found || true
          kubectl delete pods -n pageindex-mcp --field-selector=status.phase==Succeeded --ignore-not-found || true

      - name: Verify deployment
        run: |
          APP="${{ steps.vars.outputs.app }}"
          if [ "$APP" = "airline-hr-chatbot" ]; then
            NS="hr-chatbot"
          else
            NS="$APP"
          fi
          kubectl get pods -n "$NS"
